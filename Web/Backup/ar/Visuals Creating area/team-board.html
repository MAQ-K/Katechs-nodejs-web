<meta charset="utf-8">
<title>Katechs Team Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --ground:#EFF1EE;
    --paper:#FCFCFB;
    --raise:#FFFFFF;
    --ink:#12161A;
    --ink-mid:#4A5356;
    --ink-soft:#727B7D;
    --line:#DCE0DC;
    --line-soft:#E8EBE7;
    --accent:#2E6F68;
    --accent-soft:#E2EEEB;
    --clay:#A85B33;
    --clay-soft:#F6E9E1;
    --slate:#5B6570;
    --slate-soft:#E9ECEE;
    --shadow:0 1px 2px rgba(18,22,26,.05), 0 8px 22px -14px rgba(18,22,26,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0E1211;
      --paper:#161A19;
      --raise:#1C2120;
      --ink:#EDEFEC;
      --ink-mid:#B4BBB7;
      --ink-soft:#8B938F;
      --line:#2A302E;
      --line-soft:#232827;
      --accent:#63BCB1;
      --accent-soft:#172B28;
      --clay:#D89468;
      --clay-soft:#2C201A;
      --slate:#9AA5AE;
      --slate-soft:#20262A;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -16px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0E1211;
    --paper:#161A19;
    --raise:#1C2120;
    --ink:#EDEFEC;
    --ink-mid:#B4BBB7;
    --ink-soft:#8B938F;
    --line:#2A302E;
    --line-soft:#232827;
    --accent:#63BCB1;
    --accent-soft:#172B28;
    --clay:#D89468;
    --clay-soft:#2C201A;
    --slate:#9AA5AE;
    --slate-soft:#20262A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -16px rgba(0,0,0,.7);
  }

  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:"Tajawal","Segoe UI",sans-serif;
    font-size:15px;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:"IBM Plex Mono",ui-monospace,monospace; }
  h1,h2,h3{ font-family:"Cairo","Tajawal",sans-serif; margin:0; text-wrap:balance; }

  /* ================= top bar ================= */
  .topbar{
    position:sticky; top:0; z-index:40;
    background:var(--paper); border-bottom:1px solid var(--line);
  }
  .topbar-in{
    max-width:1080px; margin:0 auto; padding:11px 22px;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:baseline; gap:9px; margin-inline-end:auto; }
  .brand .k{
    font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:600;
    letter-spacing:.16em; color:var(--accent);
  }
  .brand .nm{ font-family:"Cairo",sans-serif; font-weight:700; font-size:15.5px; }
  .whoami{
    display:flex; align-items:center; gap:8px;
    padding:4px 12px 4px 4px; border:1px solid var(--line); border-radius:100px;
    background:var(--raise);
  }
  [dir="rtl"] .whoami{ padding:4px 4px 4px 12px; }
  .whoami .av{
    width:26px; height:26px; border-radius:50%; display:grid; place-items:center;
    background:var(--accent); color:var(--paper);
    font-family:"Cairo",sans-serif; font-weight:700; font-size:12.5px;
  }
  .whoami .txt{ font-size:12.5px; font-weight:500; line-height:1.2; }
  .whoami .txt small{ display:block; font-size:10.5px; color:var(--ink-soft); font-weight:400; }

  .btn{
    font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.05em;
    background:var(--raise); color:var(--ink-mid); border:1px solid var(--line);
    padding:7px 12px; cursor:pointer; border-radius:100px; line-height:1.3;
  }
  .btn:hover{ color:var(--accent); border-color:var(--accent); }
  .btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* ================= tabs ================= */
  .tabs{
    position:sticky; top:52px; z-index:39;
    background:var(--paper); border-bottom:1px solid var(--line);
  }
  .tabs-in{
    max-width:1080px; margin:0 auto; padding:0 22px;
    display:flex; gap:2px; overflow-x:auto; scrollbar-width:none;
  }
  .tabs-in::-webkit-scrollbar{ display:none; }
  .tab{
    flex:none; background:transparent; border:0; cursor:pointer;
    padding:13px 15px 12px; color:var(--ink-soft);
    font-family:"Tajawal",sans-serif; font-size:14px; font-weight:500; line-height:1.3;
    display:flex; align-items:center; gap:8px; white-space:nowrap;
    border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .tab:hover{ color:var(--ink); }
  .tab:focus-visible{ outline:2px solid var(--accent); outline-offset:-3px; border-radius:4px; }
  .tab[aria-selected="true"]{ color:var(--accent); font-weight:700; border-bottom-color:var(--accent); }
  .tab .pip{
    font-family:"IBM Plex Mono",monospace; font-size:10.5px; font-variant-numeric:tabular-nums;
    background:var(--line-soft); color:var(--ink-soft); border-radius:100px; padding:2px 7px;
  }
  .tab[aria-selected="true"] .pip{ background:var(--accent-soft); color:var(--accent); }

  /* ================= shell ================= */
  .wrap{ max-width:1080px; margin:0 auto; padding:30px 22px 100px; }
  .pagehead{ margin-bottom:30px; }
  .pagehead h1{ font-weight:800; font-size:clamp(25px,3.4vw,34px); line-height:1.08; margin-bottom:8px; }
  .pagehead p{ margin:0; color:var(--ink-mid); font-size:15px; max-width:62ch; line-height:1.55; }

  /* ================= sections ================= */
  .sec{ margin-bottom:32px; }
  .sec-head{
    display:flex; align-items:center; gap:13px; flex-wrap:wrap;
    padding-bottom:11px; margin-bottom:15px; border-bottom:1px solid var(--line);
  }
  .sec-num{
    font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:600;
    letter-spacing:.1em; color:var(--accent);
    background:var(--accent-soft); border-radius:5px; padding:4px 8px;
  }
  .sec-head h2{ font-weight:700; font-size:19px; line-height:1.2; }
  .sec-head .alt{ font-size:13px; color:var(--ink-soft); font-weight:400; font-family:"Tajawal",sans-serif; }
  .sec-head .count{
    margin-inline-start:auto;
    font-family:"IBM Plex Mono",monospace; font-size:11.5px;
    font-variant-numeric:tabular-nums; color:var(--ink-soft);
  }

  .cards{ display:grid; gap:12px; }

  /* ================= task card ================= */
  .card{
    position:relative; overflow:hidden;
    background:var(--paper); border:1px solid var(--line); border-radius:12px;
    box-shadow:var(--shadow);
    display:grid; grid-template-columns:1fr;
  }
  @media (min-width:700px){ .card.has-img{ grid-template-columns:238px 1fr; } }
  .card::before{
    content:""; position:absolute; inset-block:0; inset-inline-start:0; width:3px;
    background:var(--accent); z-index:2;
  }
  .card.k-visual::before{ background:var(--clay); }
  .card.k-element::before{ background:var(--slate); }

  .thumb{
    position:relative; margin:0; padding:0; background:var(--line-soft);
    min-height:150px; cursor:zoom-in; display:block; width:100%;
    border:0; border-inline-end:1px solid var(--line);
  }
  @media (max-width:699px){
    .thumb{ border-inline-end:0; border-bottom:1px solid var(--line); aspect-ratio:16/9; min-height:0; }
  }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .thumb .zoom{
    position:absolute; inset-block-end:8px; inset-inline-end:8px;
    background:var(--raise); border:1px solid var(--line); border-radius:6px;
    font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.05em;
    padding:3px 7px; color:var(--ink-mid); pointer-events:none;
  }
  .thumb:hover .zoom{ color:var(--accent); border-color:var(--accent); }
  .thumb:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }

  .noimg{
    display:grid; place-items:center; min-height:150px; padding:16px;
    border-inline-end:1px dashed var(--line);
    background:repeating-linear-gradient(135deg,transparent,transparent 7px,var(--line-soft) 7px,var(--line-soft) 8px);
    font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em;
    color:var(--ink-soft); text-align:center; line-height:1.6;
  }
  @media (max-width:699px){
    .noimg{ border-inline-end:0; border-bottom:1px dashed var(--line); min-height:74px; }
  }

  .card-body{ padding:16px 18px; display:flex; flex-direction:column; gap:11px; min-width:0; }
  .badges{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .badge{
    font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.09em;
    text-transform:uppercase; padding:3px 9px; border-radius:100px; font-weight:500;
    background:var(--accent-soft); color:var(--accent);
  }
  .badge.visual{ background:var(--clay-soft); color:var(--clay); }
  .badge.element{ background:var(--slate-soft); color:var(--slate); }
  .badge.who{ background:transparent; border:1px solid var(--line); color:var(--ink-soft); text-transform:none; letter-spacing:.03em; }

  .lines{ margin:0; padding:0; list-style:none; display:grid; gap:5px; }
  .lines li{ font-size:15px; line-height:1.6; color:var(--ink); overflow-wrap:anywhere; }
  .lines li.lead{ font-size:13.5px; color:var(--ink-soft); line-height:1.55; }

  .flag{
    margin:0; font-size:12.5px; line-height:1.55; color:var(--ink-soft);
    background:var(--slate-soft); border-radius:7px; padding:8px 11px;
  }
  .bnote{
    background:var(--accent-soft); border-radius:8px; padding:10px 12px;
    display:flex; flex-direction:column; gap:5px;
  }
  .bnote .bnl{
    font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--accent); font-weight:600;
  }
  .bnote p{ margin:0; font-size:13.5px; line-height:1.65; color:var(--ink-mid); }

  /* ================= current site preview ================= */
  .sitecard{
    display:grid; grid-template-columns:1fr; gap:0; overflow:hidden;
    background:var(--paper); border:1px solid var(--line); border-radius:12px;
    box-shadow:var(--shadow); margin-bottom:30px;
  }
  @media (min-width:760px){ .sitecard{ grid-template-columns:340px 1fr; } }
  .sitecard .shot{
    position:relative; display:block; width:100%; padding:0; margin:0; border:0;
    height:190px; cursor:zoom-in; background:var(--line-soft);
    border-inline-end:1px solid var(--line);
  }
  @media (max-width:759px){
    .sitecard .shot{ border-inline-end:0; border-bottom:1px solid var(--line); height:170px; }
  }
  .sitecard .shot img{ width:100%; height:100%; object-fit:cover; object-position:top center; display:block; }
  .sitecard .shot:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }
  .sitecard .shot .peek{
    position:absolute; inset-block-end:8px; inset-inline-end:8px;
    background:var(--raise); border:1px solid var(--line); border-radius:6px;
    font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.05em;
    padding:3px 8px; color:var(--ink-mid); pointer-events:none;
  }
  .sitecard .shot:hover .peek{ color:var(--accent); border-color:var(--accent); }
  .sitecard .say{ padding:17px 19px; display:flex; flex-direction:column; gap:9px; justify-content:center; }
  .sitecard .say h3{ font-size:16.5px; font-weight:700; line-height:1.3; }
  .sitecard .say p{ margin:0; font-size:14px; line-height:1.6; color:var(--ink-mid); max-width:58ch; }
  .sitecard .say .meta{
    font-family:"IBM Plex Mono",monospace; font-size:10.5px;
    letter-spacing:.05em; color:var(--ink-soft);
  }

  /* ================= service briefs ================= */
  .briefs{ display:grid; gap:12px; }
  @media (min-width:760px){ .briefs{ grid-template-columns:1fr 1fr; } }
  .brief{
    background:var(--paper); border:1px solid var(--line); border-radius:12px;
    padding:17px 19px 18px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:10px;
  }
  .brief-top{ display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; }
  .brief-top .n{
    font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:600;
    color:var(--accent); background:var(--accent-soft); border-radius:5px; padding:3px 7px;
  }
  .brief-top h3{ font-size:16.5px; font-weight:700; line-height:1.25; }
  .brief-top .alt{ font-size:12.5px; color:var(--ink-soft); font-weight:400; }
  .brief .what{ margin:0; font-size:14.5px; line-height:1.6; color:var(--ink); }
  .brief .chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:auto; padding-top:4px; }
  .brief .chip{
    font-size:12px; line-height:1.35; padding:4px 10px; border-radius:100px;
    background:var(--line-soft); color:var(--ink-mid);
  }
  .brief .route{
    font-family:"IBM Plex Mono",monospace; font-size:10.5px;
    color:var(--ink-soft); letter-spacing:.03em;
  }

  /* ================= lightbox ================= */
  .lightbox{
    position:fixed; inset:0; z-index:90; display:none;
    background:rgba(10,13,12,.9); padding:26px; align-items:center; justify-content:center;
  }
  .lightbox.on{ display:flex; }
  .lightbox.tall{ align-items:flex-start; overflow-y:auto; padding:20px 20px 64px; }
  .lightbox.tall img{ max-height:none; width:min(1100px,100%); margin:0 auto; border-radius:6px; }
  .lightbox.tall .cap{ position:fixed; }
  .lightbox img{
    max-width:100%; max-height:82vh; border-radius:10px; display:block;
    box-shadow:0 30px 70px -20px rgba(0,0,0,.8);
  }
  .lightbox .cap{
    position:absolute; inset-inline:0; bottom:22px; text-align:center; padding:0 26px;
    color:#E8EAE7; font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.05em;
  }
  .lightbox .x{
    position:absolute; top:18px; inset-inline-end:20px;
    background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.28);
    border-radius:100px; width:34px; height:34px; font-size:16px; cursor:pointer; line-height:1;
  }
  .lightbox .x:hover{ background:rgba(255,255,255,.2); }

  /* ================= picker ================= */
  .gate{ max-width:440px; margin:8vh auto 0; }
  .gate h1{ font-weight:800; font-size:30px; margin-bottom:8px; }
  .gate .lede{ color:var(--ink-mid); margin:0 0 26px; line-height:1.6; }
  .roles{ display:grid; gap:10px; }
  .role{
    display:flex; align-items:center; gap:13px; width:100%; text-align:start;
    background:var(--paper); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; cursor:pointer; color:var(--ink); font-family:inherit; font-size:15px;
    box-shadow:var(--shadow); transition:border-color .18s ease;
  }
  .role:hover{ border-color:var(--accent); }
  .role:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .role .av{
    flex:none; width:40px; height:40px; border-radius:50%; display:grid; place-items:center;
    background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent);
    font-family:"Cairo",sans-serif; font-size:16px; font-weight:700;
  }
  .role:hover .av{ background:var(--accent); color:var(--paper); }
  .role .who{ font-weight:700; }
  .role .what{
    display:block; font-family:"IBM Plex Mono",monospace;
    font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); margin-top:2px;
  }
  .role .go{ margin-inline-start:auto; color:var(--ink-soft); font-size:17px; }
  .role:hover .go{ color:var(--accent); }
  [dir="rtl"] .role .go{ transform:scaleX(-1); }

  footer{
    margin-top:42px; padding-top:18px; border-top:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;
    font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.04em; color:var(--ink-soft);
  }
  footer a{ color:var(--accent); text-decoration:none; }
  footer a:hover{ text-decoration:underline; }

  @media (max-width:560px){
    .wrap{ padding:24px 15px 80px; }
    .topbar-in{ padding:9px 15px; gap:9px; }
    .tabs-in{ padding:0 15px; }
    .brand .nm{ font-size:14px; }
  }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>

<div id="root"></div>
<div class="lightbox" id="lb" role="dialog" aria-modal="true" aria-label="preview">
  <button class="x" id="lbx" aria-label="close">&times;</button>
  <img id="lbimg" alt="">
  <div class="cap" id="lbcap"></div>
</div>

  }

  function every(){ var a=[]; SECTIONS.forEach(function(s){ s.tasks.forEach(function(t){ if(!t.hidden) a.push(t); }); }); return a; }
  function forWho(w){ return every().filter(function(t){ return t.owner === w; }); }
  function loose(){ return every().filter(function(t){ return !t.owner; }); }

  function tabsFor(){ return isDev() ? ["all","nada","hadeer","backlog","briefs"] : ["mine","briefs"]; }
  function validTab(){ var l = tabsFor(); return l.indexOf(tab) >= 0 ? tab : l[0]; }

  /* ===== chrome ===== */
  function topbar(t){
    var right = "";
    if(me){
      right = '<div class="whoami">' +
        '<span class="av" aria-hidden="true">' + esc(nameOf(me).charAt(0)) + '</span>' +
        '<span class="txt">' + esc(nameOf(me)) + '<small>' + esc(roleOf(me)) + '</small></span>' +
      '</div>' +
      '<button class="btn" data-act="signout">' + esc(t.change) + '</button>';
    }
    return '<div class="topbar"><div class="topbar-in">' +
      '<div class="brand"><span class="k">KATECHS</span><span class="nm">' + esc(t.brand) + '</span></div>' +
      right +
      '<button class="btn" data-act="lang">' + esc(t.langBtn) + '</button>' +
    '</div></div>';
  }

  function tabLabel(id, t){
    if(id === "all") return t.tabAll;
    if(id === "mine") return t.tabMine;
    if(id === "backlog") return t.tabBacklog;
    if(id === "briefs") return t.tabBriefs;
    return nameOf(id);
  }
  function tabCount(id){
    if(id === "briefs") return SERVICES.length;
    if(id === "backlog") return loose().length;
    if(id === "all") return forWho("nada").length + forWho("hadeer").length;
    if(id === "mine") return forWho(me).length;
    return forWho(id).length;
  }
  function tabbar(t){
    var cur = validTab();
    var items = tabsFor().map(function(id){
      return '<button class="tab" role="tab" data-act="tab" data-tab="' + id + '" ' +
             'aria-selected="' + (id === cur ? "true" : "false") + '">' +
        esc(tabLabel(id, t)) + '<span class="pip" dir="ltr">' + tabCount(id) + '</span>' +
      '</button>';
    }).join("");
    return '<div class="tabs"><div class="tabs-in" role="tablist">' + items + '</div></div>';
  }

  /* ===== pieces ===== */
  function card(task, t, showOwner){
    var body = lang === "ar" ? task.ar : task.en;
    var lead = lang === "ar" ? task.leadAr : task.leadEn;
    var flag = lang === "ar" ? (task.flagAr || task.flag) : task.flag;
    var note = lang === "ar" ? (task.noteAr || task.note) : task.note;

    var visual = "";
    if(task.kind === "visual" || task.kind === "element"){
      if(task.img && IMG[task.img]){
        visual = '<button class="thumb" data-act="zoom" data-img="' + esc(task.img) + '" ' +
                 'data-cap="' + esc(body[0] || "") + '" aria-label="' + esc(t.zoom) + '">' +
          '<img src="' + IMG[task.img] + '" alt="' + esc(body[0] || "") + '" loading="lazy">' +
          '<span class="zoom mono">⤢ ' + esc(t.zoom) + '</span>' +
        '</button>';
      }else{
        visual = '<div class="noimg">' + esc(t.noRef) + '</div>';
      }
    }

    var badges = '<span class="badge ' + esc(task.kind) + '">' + esc(t[task.kind]) + '</span>';
    if(showOwner && task.owner) badges += '<span class="badge who">' + esc(nameOf(task.owner)) + '</span>';

    var ul = "";
    if(lead) ul += '<li class="lead">' + esc(lead) + '</li>';
    body.forEach(function(l){ ul += '<li>' + esc(l) + '</li>'; });

    return '<article class="card k-' + esc(task.kind) + (visual ? " has-img" : "") + '">' +
      visual +
      '<div class="card-body">' +
        '<div class="badges">' + badges + '</div>' +
        '<ul class="lines">' + ul + '</ul>' +
        (note ? '<div class="bnote"><span class="bnl">' + esc(t.briefNote) + '</span>' +
                  '<p>' + esc(note) + '</p></div>' : "") +
        (flag ? '<p class="flag">' + esc(flag) + '</p>' : "") +
      '</div>' +
    '</article>';
  }

  function section(sec, list, t, showOwner, num){
    var primary = lang === "ar" ? sec.ar : sec.en;
    var secondary = lang === "ar" ? sec.en : sec.ar;
    return '<section class="sec">' +
      '<div class="sec-head">' +
        '<span class="sec-num">' + (num < 10 ? "0"+num : num) + '</span>' +
        '<h2>' + esc(primary) + '</h2>' +
        '<span class="alt" dir="' + (lang === "ar" ? "ltr" : "rtl") + '">' + esc(secondary) + '</span>' +
        '<span class="count">' + esc(countLabel(list.length)) + '</span>' +
      '</div>' +
      '<div class="cards">' + list.map(function(x){ return card(x, t, showOwner); }).join("") + '</div>' +
    '</section>';
  }

  function taskList(t, filter, showOwner){
    var num = 0, h = "";
    SECTIONS.forEach(function(sec){
      var list = sec.tasks.filter(function(x){ return !x.hidden && filter(x); });
      if(!list.length) return;
      num += 1;
      h += section(sec, list, t, showOwner, num);
    });
    return h;
  }

  function sitePanel(t){
    if(!IMG.site) return "";
    return '<div class="sitecard">' +
      '<button class="shot" data-act="zoom" data-img="site" data-tall="1" ' +
              'data-cap="' + esc(t.siteMeta) + '" aria-label="' + esc(t.sitePeek) + '">' +
        '<img src="' + IMG.site + '" alt="' + esc(t.siteTitle) + '">' +
        '<span class="peek">⤢ ' + esc(t.sitePeek) + '</span>' +
      '</button>' +
      '<div class="say">' +
        '<h3>' + esc(t.siteTitle) + '</h3>' +
        '<p>' + esc(t.siteBody) + '</p>' +
        '<span class="meta" dir="ltr">' + esc(t.siteMeta) + '</span>' +
      '</div>' +
    '</div>';
  }

  function briefsView(t){
    var byGroup = {};
    SERVICES.forEach(function(s){ (byGroup[s.g] = byGroup[s.g] || []).push(s); });
    var n = 0, h = "";
    ["infra","build","grow"].forEach(function(g, gi){
      var list = byGroup[g] || []; if(!list.length) return;
      h += '<section class="sec">' +
        '<div class="sec-head">' +
          '<span class="sec-num">' + ("0" + (gi+1)) + '</span>' +
          '<h2>' + esc(lang === "ar" ? GROUPS[g].ar : GROUPS[g].en) + '</h2>' +
          '<span class="alt" dir="' + (lang === "ar" ? "ltr" : "rtl") + '">' +
            esc(lang === "ar" ? GROUPS[g].en : GROUPS[g].ar) + '</span>' +
        '</div><div class="briefs">' +
        list.map(function(s){
          n += 1;
          var types = lang === "ar" ? s.typesAr : s.typesEn;
          return '<article class="brief">' +
            '<div class="brief-top">' +
              '<span class="n">' + (n < 10 ? "0"+n : n) + '</span>' +
              '<h3>' + esc(lang === "ar" ? s.ar : s.en) + '</h3>' +
              '<span class="alt" dir="' + (lang === "ar" ? "ltr" : "rtl") + '">' +
                esc(lang === "ar" ? s.en : s.ar) + '</span>' +
            '</div>' +
            '<p class="what">' + esc(lang === "ar" ? s.whatAr : s.whatEn) + '</p>' +
            '<div class="chips">' +
              types.map(function(c){ return '<span class="chip">' + esc(c) + '</span>'; }).join("") +
            '</div>' +
            '<span class="route" dir="ltr">' + esc(s.route) + '</span>' +
          '</article>';
        }).join("") +
        '</div></section>';
    });
    return h;
  }

  function board(t){
    var cur = validTab();
    var h = '<div class="wrap">';
    var title, sub;

    if(cur === "briefs"){ title = t.headBriefs; sub = t.subBriefs; }
    else if(cur === "backlog"){ title = t.headBacklog; sub = t.subBacklog; }
    else if(cur === "all"){ title = t.headAll; sub = t.subAll; }
    else if(cur === "mine"){ title = t.headMine; sub = t.subMine; }
    else { title = nameOf(cur) + " — " + t.headOne; sub = t.subOne + " " + nameOf(cur) + "."; }

    h += '<div class="pagehead"><h1>' + esc(title) + '</h1><p>' + esc(sub) + '</p></div>';

    if(cur === "briefs"){ h += briefsView(t); }
    else{
      h += sitePanel(t);
      if(cur === "all"){ h += taskList(t, function(x){ return !!x.owner; }, true); }
      else if(cur === "backlog"){ h += taskList(t, function(x){ return !x.owner; }, false); }
      else{
        var who = cur === "mine" ? me : cur;
        h += taskList(t, function(x){ return x.owner === who; }, false);
      }
    }

    h += '<footer><span>' + esc(t.src) + '</span>' +
      '<a href="' + BRIEFS_URL + '" target="_blank" rel="noopener">' + esc(t.briefsLink) + ' ↗</a></footer>';
    return h + '</div>';
  }

  function gate(t){
    var rows = ["nada","hadeer","manager"].map(function(k){
      var nm = nameOf(k), rl = roleOf(k);
      return '<button class="role" data-act="pick" data-role="' + k + '" ' +
             'aria-label="' + esc(nm + " — " + rl) + '">' +
        '<span class="av" aria-hidden="true">' + esc(nm.charAt(0)) + '</span>' +
        '<span><span class="who">' + esc(nm) + '</span><span class="what">' + esc(rl) + '</span></span>' +
        '<span class="go" aria-hidden="true">→</span>' +
      '</button>';
    }).join("");
    return '<div class="wrap"><div class="gate">' +
      '<h1>' + esc(t.gateTitle) + '</h1>' +
      '<p class="lede">' + esc(t.gateLede) + '</p>' +
      '<div class="roles">' + rows + '</div>' +
    '</div></div>';
  }

  function paint(){
    var t = T[lang];
    document.documentElement.setAttribute("lang", lang);
    document.documentElement.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");
    root.innerHTML = topbar(t) + (me ? (tabbar(t) + board(t)) : gate(t));
  }

  function openLb(key, cap, tall){
    if(!IMG[key]) return;
    lbimg.src = IMG[key]; lbimg.alt = cap || ""; lbcap.textContent = cap || "";
    lb.classList.toggle("tall", !!tall);
    lb.classList.add("on");
    lb.scrollTop = 0;
  }
  function closeLb(){ lb.classList.remove("on"); lb.classList.remove("tall"); lbimg.src = ""; }

  document.addEventListener("click", function(e){
    var el = e.target.closest("[data-act]");
    if(!el) return;
    var a = el.getAttribute("data-act");
    if(a === "lang"){ lang = lang === "ar" ? "en" : "ar"; save("kt_lang", lang); paint(); }
    else if(a === "signout"){ me = null; tab = ""; drop("kt_me"); drop("kt_tab"); paint(); }
    else if(a === "pick"){ me = el.getAttribute("data-role"); tab = ""; save("kt_me", me); paint(); }
    else if(a === "tab"){ tab = el.getAttribute("data-tab"); save("kt_tab", tab); paint(); window.scrollTo(0,0); }
    else if(a === "zoom"){
      openLb(el.getAttribute("data-img"), el.getAttribute("data-cap"), el.getAttribute("data-tall"));
    }
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && lb.classList.contains("on")) closeLb();
  });
  document.getElementById("lbx").addEventListener("click", closeLb);
  lb.addEventListener("click", function(e){ if(e.target === lb) closeLb(); });

  paint();
})();
</script>
